name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（周期推导 42 项）
        run: npm run test:unit

      - name: 生产构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # 需要活服务的三个脚本（e2e / obsidian / maintainability）不在 CI 里跑：
  # 它们要连 localhost:3080，放到部署流水线的「部署后冒烟」阶段更合适。
